@if (router.url === '/login') {

<router-outlet></router-outlet>

} @else {

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div>
        <h1>SalaryHub</h1>
        <p>HR Management</p>
      </div>
    </div>

    <div class="nav-heading">WORKSPACE</div>

    <nav class="navigation" aria-label="Main navigation">
      <a
        class="nav-item"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="nav-icon">◫</span>
        <span>Dashboard</span>
      </a>

      <a
        class="nav-item"
        routerLink="/employees"
        routerLinkActive="active"
      >
        <span class="nav-icon">♙</span>
        <span>Employees</span>
      </a>

      <div class="nav-item muted">
        <span class="nav-icon">◤</span>
        <span>Salary records</span>
        <span class="nav-status">Soon</span>
      </div>
    </nav>

    <div class="sidebar-bottom">
      <div class="sidebar-note">
        <span class="status-dot"></span>
        <div>
          <strong>SalaryHub</strong>
          <p>HR workspace</p>
        </div>
      </div>

      <p class="sidebar-version">Employee &amp; salary management</p>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div class="breadcrumb">
        <span>Workspace</span>
        <span class="breadcrumb-divider">/</span>
        <strong>SalaryHub</strong>
      </div>

      <div class="topbar-right">
  <span class="system-indicator">
    <span class="status-dot"></span>
    HR overview
  </span>

        <div class="user-info">
          <div class="user-details">
            <strong>{{ username || 'HR Manager' }}</strong>
            <span>HR Manager</span>
          </div>

          <div class="avatar" aria-label="HR manager">HR</div>
        </div>

        <button
          type="button"
          class="logout-button"
          (click)="logout()"
        >
          Logout
        </button>
      </div>
    </header>

    <router-outlet></router-outlet>
  </main>
</div>

}
